<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tournoi EPS : brassage et tableaux à classement intégral pour les sports de raquette. Fonctionne hors ligne, sans compte.">
<meta name="theme-color" content="#1d4ed8">
<title>Tournoi EPS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#view">Aller au contenu</a>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">🏸</span>
    <span class="brand-name">Tournoi EPS</span>
  </div>
  <div class="tournament-switch">
    <label for="tournamentSelect" class="sr-only">Tournoi affiché</label>
    <select id="tournamentSelect"></select>
    <button type="button" class="btn btn-small" data-action="new-tournament">Nouveau</button>
    <label class="btn btn-small" for="importInput">Importer</label>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections du tournoi" id="tabs"></nav>

<div id="banner" class="banner" hidden></div>

<main id="view" tabindex="-1"></main>

<div id="live" class="toast" role="status" aria-live="polite"></div>

<dialog id="matchDialog" aria-labelledby="matchDialogTitle"></dialog>

<noscript><p class="card">Cette application nécessite JavaScript.</p></noscript>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
