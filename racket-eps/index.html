<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Racket EPS : tournois de raquette, appel, terrains et classement Elo par classe. Données stockées sur l'appareil.">
<title>Racket EPS — Suivi &amp; Elo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="brand">🏸 Racket <span>EPS</span></div><div class="muted small">Tournois • Classements Elo • Suivi longitudinal</div></div>
    <div class="row"><label class="sr-only" for="classSelect">Classe</label><select id="classSelect" style="width:auto"></select><button class="btn" data-action="add-class">+ Classe</button><button class="btn" data-action="demo-class" title="Classe d'élèves fictifs pour tester l'application">Classe exemple</button></div>
  </header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div id="banner"></div>
  <main id="view"></main>
  <footer class="muted small" style="padding:25px 0">Racket EPS · Données enregistrées sur cet appareil · Exportez régulièrement une sauvegarde JSON</footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="qrDialog" aria-labelledby="qrTitle"></dialog>
<dialog id="studentDialog" aria-labelledby="studentTitle"></dialog>
<!-- Bibliothèques QR facultatives (voir lib/README.md) : sans elles, codes texte et lecteur intégré du navigateur. -->
<script src="lib/qrcode-generator.js"></script>
<script src="lib/jsQR.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
