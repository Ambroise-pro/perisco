<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racket EPS — Suivi & Elo</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8f0f7;background:#091522}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1320px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:850}.brand span{color:#5ce1bb}.muted{color:#96aabd}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}.nav button,.btn{border:1px solid #345064;background:#14293b;color:#eaf4fa;border-radius:11px;padding:10px 14px}.nav button.active,.primary{background:#1d977e!important;border-color:#1d977e!important;color:white!important}.danger{background:#703043!important;border-color:#a34c60!important}.panel{background:#102436;border:1px solid #274157;border-radius:17px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0;flex:1;min-width:145px}.field label{font-size:12px;color:#a6bbcc}input,select,textarea{background:#081a29;border:1px solid #3a5569;border-radius:9px;padding:10px;color:#f2f7fc;min-width:0;width:100%}textarea{min-height:105px}.stat{padding:15px;border-radius:13px;background:#172f42}.stat b{display:block;font-size:25px}.stat small{color:#a9bdcb}.court{background:#146d62;border:2px solid #55b9a7;border-radius:14px;padding:12px;min-height:140px}.court:nth-child(even){background:#1c587c;border-color:#5499c0}.court h3{margin:0 0 12px}.player{background:#eef8f7;color:#163342;border-radius:9px;padding:9px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}.player select{width:auto;max-width:100px;padding:5px;color:#163342;background:white}.badge{font-size:11px;padding:4px 7px;border-radius:30px;background:#284a60;color:#c8e3ee}.good{color:#67e5b3}.bad{color:#ff9eaa}.match{display:grid;grid-template-columns:minmax(85px,1fr) 66px 20px 66px minmax(85px,1fr) auto;gap:7px;align-items:center;padding:10px;border-bottom:1px solid #28445a}.match input{text-align:center;padding:8px}.match .name{text-align:center;font-weight:600;font-size:13px}.match .name.win{color:#5ce1bb}.small{font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #29445a;white-space:nowrap}th{color:#a9c2d0}h1,h2,h3{margin-top:0}h2{font-size:20px}h3{font-size:16px}.hidden{display:none!important}.notice{padding:12px;background:#173e4a;border-left:3px solid #57d8bd;border-radius:8px;margin:10px 0}.warn{background:#4d3928;border-color:#e8b568}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:35px;text-align:center;color:#a7bac8}.pill{border-radius:30px;padding:5px 9px;background:#254156;font-size:12px}.bar{height:8px;background:#294559;border-radius:9px;overflow:hidden}.bar>i{display:block;background:#46caa8;height:100%}@media(max-width:640px){.app{padding:10px}.panel{padding:12px}.match{grid-template-columns:1fr 50px 12px 50px 1fr;gap:4px}.match button{grid-column:1/-1}.match input{padding:5px}.brand{font-size:21px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">🏸 Racket <span>EPS</span></div><div class="muted small">Tournois • Classements Elo • Suivi longitudinal</div></div><div class="row"><select id="classSelect" style="width:auto" onchange="chooseClass(this.value)"></select><button class="btn" onclick="addClass()">+ Classe</button></div></header><nav class="nav" id="nav"></nav><main id="view"></main><footer class="muted small" style="padding:25px 0">Racket EPS · Données enregistrées sur cet appareil · Exportez régulièrement une sauvegarde JSON</footer></div><script>
const KEY='racket_eps_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.classes))db={classes:[],active:null};let tab='dashboard',selectedStudent=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||Date.now()+'_'+Math.random(),cl=()=>db.classes.find(c=>c.id===db.active),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),fmt=n=>Number(n).toFixed(1),date=()=>new Date().toISOString().slice(0,10);const modes={pools:'Poules classiques',challenge:'Jeu du défi',ladder:'Montante-descendante',swiss:'Ronde suisse',reclass:'Tournoi avec reclassement'};
function notify(s){alert(s)}function ask(s){return confirm(s)}function render(){let c=cl();$('classSelect').innerHTML=db.classes.map(x=>`<option value="${x.id}" ${x.id===db.active?'selected':''}>${esc(x.name)}</option>`).join('')||'<option>Aucune classe</option>';const tabs=[['dashboard','Tableau de bord'],['students','Élèves'],['session','Séance'],['ranking','Classement Elo'],['history','Historique'],['settings','Réglages']];$('nav').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('');$('view').innerHTML=!c?welcome():({dashboard,students,session,ranking,history,settings}[tab]||dashboard)(c)}function welcome(){return `<section class="panel"><h2>Bienvenue dans Racket EPS</h2><p>Créez une classe pour organiser vos séances, gérer les absences et suivre les classements Elo.</p><button class="btn primary" onclick="addClass()">Créer ma première classe</button></section>`}function addClass(){let name=prompt('Nom de la classe (ex. 3e B)');if(!name?.trim())return;let c={id:uid(),name:name.trim(),sport:'Badminton',courts:4,students:[],sessions:[],k:32};db.classes.push(c);db.active=c.id;save();tab='students';render()}function chooseClass(id){db.active=id;save();render()}function active(c){return c.sessions.find(s=>s.status!=='closed')}
function stats(c){let map={};c.students.forEach(p=>map[p.id]={id:p.id,name:p.name,elo:1000,played:0,wins:0,losses:0,for:0,against:0,opponents:new Set(),sessions:0,history:[]});for(const s of c.sessions.filter(x=>x.status==='closed').sort((a,b)=>a.seq-b.seq)){const start=Object.fromEntries(Object.entries(map).map(([id,p])=>[id,p.elo]));let delta={};const played=new Set();for(const m of s.matches){if(!m.done||!map[m.a]||!map[m.b])continue;let A=map[m.a],B=map[m.b];let winA=m.sa>m.sb,winB=m.sb>m.sa;if(!winA&&!winB)continue;const ea=1/(1+Math.pow(10,(start[m.b]-start[m.a])/400));let d=(s.k??c.k??32)*((winA?1:0)-ea);delta[m.a]=(delta[m.a]||0)+d;delta[m.b]=(delta[m.b]||0)-d;A.played++;B.played++;A.wins+=+winA;B.wins+=+winB;A.losses+=+winB;B.losses+=+winA;A.for+=m.sa;A.against+=m.sb;B.for+=m.sb;B.against+=m.sa;A.opponents.add(m.b);B.opponents.add(m.a);played.add(m.a);played.add(m.b)}for(const id in map){map[id].elo+=(delta[id]||0);if(played.has(id))map[id].sessions++;map[id].history.push({seq:s.seq,elo:map[id].elo,delta:delta[id]||0})}}return map}function ranks(c){let st=stats(c);return c.students.map(p=>st[p.id]).sort((a,b)=>b.elo-a.elo||a.name.localeCompare(b.name,'fr'))}function getName(c,id){return c.students.find(p=>p.id===id)?.name||'Élève supprimé'}function dashboard(c){let r=ranks(c),s=active(c),closed=c.sessions.filter(s=>s.status==='closed').length;return `<div class="grid"><div class="stat"><b>${c.students.length}</b><small>Élèves inscrits</small></div><div class="stat"><b>${closed}</b><small>Séances clôturées</small></div><div class="stat"><b>${c.courts}</b><small>Terrains</small></div><div class="stat"><b>${c.sessions.reduce((n,s)=>n+s.matches.filter(m=>m.done).length,0)}</b><small>Matchs enregistrés</small></div></div><section class="panel" style="margin-top:16px"><h2>${s?'Séance en cours':'Prochaine séance'}</h2><p class="muted">${s?`Séance ${s.seq} · ${modes[s.mode]} · ${s.status==='setup'?'Répartition à valider':'Matchs en cours'}`:'Préparez une séance, faites l’appel puis validez les terrains avant de lancer les matchs.'}</p><button class="btn primary" onclick="tab='session';render()">${s?'Reprendre la séance':'Préparer une séance'}</button></section><section class="panel"><h2>Top 10 · Classement Elo</h2>${rankingTable(r.slice(0,10))}</section>`}function rankingTable(r){return `<div class="tablewrap"><table><thead><tr><th>Rang</th><th>Élève</th><th>Elo</th><th>Matchs</th><th>Victoires</th><th>%</th><th>Diff. points</th></tr></thead><tbody>${r.map((p,i)=>`<tr><td>${i+1}</td><td><button class="btn" onclick="selectedStudent='${p.id}';tab='ranking';render()">${esc(p.name)}</button></td><td><b>${fmt(p.elo)}</b></td><td>${p.played}</td><td>${p.wins}</td><td>${p.played?fmt(p.wins/p.played*100):'—'}%</td><td>${p.for-p.against}</td></tr>`).join('')}</tbody></table></div>`}
function students(c){return `<section class="panel"><h2>Gestion des élèves</h2><div class="row"><div class="field"><label>Ajouter un élève</label><input id="newStudent" placeholder="Prénom Nom" onkeydown="if(event.key==='Enter')addStudent()"></div><button class="btn primary" onclick="addStudent()">Ajouter</button></div><div class="field"><label>Importer une liste (un élève par ligne)</label><textarea id="bulk" placeholder="Emma Martin&#10;Lucas Dupont&#10;..."></textarea></div><button class="btn" onclick="bulkStudents()">Importer les noms</button><p class="muted small">Les noms restent stockés dans ce navigateur. Évitez les données nominatives sur un appareil partagé.</p></section><section class="panel"><h2>Liste (${c.students.length})</h2>${c.students.map((p,i)=>`<div class="row between" style="border-bottom:1px solid #2b4355;padding:8px"><span>${i+1}. ${esc(p.name)}</span><button class="btn" onclick="renameStudent('${p.id}')">Renommer</button></div>`).join('')||'<div class="empty">Aucun élève</div>'}</section>`}function addStudent(){let c=cl(),v=$('newStudent').value.trim();if(!v)return;if(c.students.some(p=>p.name.toLowerCase()===v.toLowerCase()))return notify('Nom déjà présent');c.students.push({id:uid(),name:v});save();render()}function bulkStudents(){let c=cl(),lines=$('bulk').value.split(/\n/).map(x=>x.trim()).filter(Boolean);for(let name of lines)if(!c.students.some(p=>p.name.toLowerCase()===name.toLowerCase()))c.students.push({id:uid(),name});save();render()}function renameStudent(id){let c=cl(),p=c.students.find(p=>p.id===id),name=prompt('Nom',p.name);if(name?.trim()){p.name=name.trim();save();render()}}
function session(c){let s=active(c);if(!s)return newSessionUI(c);if(s.status==='setup')return setupUI(c,s);return playingUI(c,s)}function newSessionUI(c){return `<section class="panel"><h2>Nouvelle séance</h2><div class="row"><div class="field"><label>Date</label><input type="date" id="sdate" value="${date()}"></div><div class="field"><label>Format de tournoi</label><select id="smode" onchange="modeFields()">${Object.entries(modes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div id="modeOptions"></div><button class="btn primary" onclick="createSession()">Créer la séance et faire l'appel</button></section><script-placeholder></script-placeholder>` .replace('<script-placeholder></script-placeholder>','<div class="muted small">Chaque match compte pour Elo, mais les indices ne changent qu’à la clôture de la séance.</div>')+`<script-placeholder></script-placeholder>`.replace('<script-placeholder></script-placeholder>','')+`<div style="display:none" id="newFlag"></div>`}function modeFields(){let e=$('modeOptions');if(!e)return;let mode=$('smode').value;e.innerHTML=`<div class="row"><div class="field"><label>Score cible (indicatif)</label><input id="target" type="number" min="1" value="11"></div><div class="field"><label>Nombre de rondes / rotations</label><input id="rounds" type="number" min="1" max="30" value="${mode==='swiss'?4:mode==='ladder'?4:3}"></div>${mode==='pools'||mode==='reclass'||mode==='ladder'?`<div class="field"><label>Joueurs par groupe</label><select id="groupSize">${[2,3,4,5,6].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n}</option>`).join('')}</select></div>`:''}${mode==='ladder'?`<div class="field"><label>Variante</label><select id="ladderType"><option value="single">Individuelle (2 par terrain)</option><option value="group" selected>Groupes / mini-tournois</option></select></div><div class="field"><label>Montées / descentes par rotation (groupes)</label><select id="move"><option>1</option><option>2</option></select></div>`:''}${mode==='challenge'?`<div class="field"><label>Écart maximal de défi</label><input id="challengeGap" type="number" min="1" value="3"></div>`:''}${mode==='pools'?`<div class="field"><label>Matchs</label><select id="legs"><option value="1">Aller simple</option><option value="2">Aller-retour</option></select></div>`:''}</div>`}function createSession(){let c=cl();if(c.students.length<2)return notify('Ajoutez au moins 2 élèves');let mode=$('smode').value,s={id:uid(),seq:c.sessions.length+1,date:$('sdate').value||date(),mode,status:'setup',absent:[],positions:[],matches:[],round:0,rounds:Math.max(1,+$('rounds').value||3),target:Math.max(1,+$('target').value||11),groupSize:+($('groupSize')?.value||4),ladderType:$('ladderType')?.value||'group',move:+($('move')?.value||1),gap:+($('challengeGap')?.value||3),legs:+($('legs')?.value||1),k:c.k};c.sessions.push(s);save();render()}function setupUI(c,s){let ranked=ranks(c),present=ranked.filter(p=>!s.absent.includes(p.id));if(!s.positions.length)s.positions=present.map(p=>p.id);s.positions=s.positions.filter(id=>present.some(p=>p.id===id));present.forEach(p=>{if(!s.positions.includes(p.id))s.positions.push(p.id)});let size=Math.ceil(present.length/c.courts),groups=Array.from({length:Math.min(c.courts,present.length)},()=>[]);s.positions.forEach((id,i)=>groups[Math.min(Math.floor(i/Math.max(1,size)),groups.length-1)].push(id));return `<section class="panel"><div class="row between"><h2>Séance ${s.seq} · Appel et terrains</h2><span class="badge">Validation obligatoire</span></div><p class="muted">${esc(s.date)} · ${modes[s.mode]} · ${present.length} présents / ${c.students.length}</p><h3>Appel</h3><div class="grid">${ranked.map(p=>`<label class="player"><span>${esc(p.name)} · Elo ${fmt(p.elo)}</span><span><input type="checkbox" style="width:auto" ${s.absent.includes(p.id)?'checked':''} onchange="toggleAbsent('${p.id}',this.checked)"> Absent</span></label>`).join('')}</div><h3 style="margin-top:20px">Proposition automatique de placement</h3><p class="muted small">Le terrain 1 regroupe les meilleurs Elo. Modifiez le terrain d'un élève si nécessaire ; le classement Elo n'est pas modifié.</p><div class="grid">${groups.map((g,i)=>`<div class="court"><h3>Terrain ${i+1}</h3>${g.map(id=>`<div class="player">${esc(getName(c,id))}<select onchange="movePlayer('${id}',this.value)">${groups.map((_,j)=>`<option value="${j}" ${j===i?'selected':''}>T${j+1}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="validateCourts()" ${present.length<2?'disabled':''}>✓ Valider les terrains et générer les matchs</button><button class="btn danger" onclick="cancelSession()">Annuler la séance</button></div></section>`}function toggleAbsent(id,yes){let s=active(cl());s.absent=s.absent.filter(x=>x!==id);if(yes)s.absent.push(id);s.positions=[];save();render()}function movePlayer(id,court){let c=cl(),s=active(c),count=s.positions.length,n=Math.min(c.courts,count),size=Math.ceil(count/n),target=+court*size;let pos=s.positions.indexOf(id);s.positions.splice(pos,1);s.positions.splice(Math.min(target,s.positions.length),0,id);save();render()}function cancelSession(){let c=cl();if(!ask('Annuler cette séance et ses résultats ?'))return;c.sessions=c.sessions.filter(s=>s.status==='closed');save();render()}
function pairs(ids,round=0){let out=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)out.push([ids[i],ids[j]]);return out}function makeMatch(a,b,round,court){return{id:uid(),a,b,sa:null,sb:null,done:false,round,court}}function presentIds(c,s){return ranks(c).filter(p=>!s.absent.includes(p.id)).map(p=>p.id)}function groupPositions(c,s){let ids=s.positions,groupSize=s.mode==='ladder'&&s.ladderType==='single'?2:s.groupSize;let n=Math.min(c.courts,Math.ceil(ids.length/groupSize));if(!n)n=1;let groups=Array.from({length:n},()=>[]);ids.forEach((id,i)=>groups[Math.min(Math.floor(i/groupSize),n-1)].push(id));return groups}function validateCourts(){let c=cl(),s=active(c);if(!ask('Valider les terrains et démarrer la séance ?'))return;s.status='playing';s.round=1;if(s.mode==='pools'){let groups=groupPositions(c,s);s.matches=groups.flatMap((g,i)=>{let pp=pairs(g);return [...pp,...(s.legs===2?pp.map(p=>[p[1],p[0]]):[])].map(([a,b],j)=>makeMatch(a,b,1+Math.floor(j/Math.max(1,g.length)),i+1))})}else if(s.mode==='reclass'){s.phase='brassage';s.matches=groupPositions(c,s).flatMap((g,i)=>pairs(g).map(([a,b])=>makeMatch(a,b,1,i+1)))}else if(s.mode==='challenge'){s.matches=[]}else{generateRound(c,s)}save();render()}
function matchCounts(s){let n={};s.matches.filter(m=>m.done).forEach(m=>{n[m.a]=(n[m.a]||0)+1;n[m.b]=(n[m.b]||0)+1});return n}function previousPairs(s){return new Set(s.matches.map(m=>[m.a,m.b].sort().join('|')))}function swissPairs(c,s){let ids=presentIds(c,s),score={};ids.forEach(id=>score[id]=0);s.matches.filter(m=>m.done).forEach(m=>{if(m.sa>m.sb)score[m.a]++;else if(m.sb>m.sa)score[m.b]++});ids.sort((a,b)=>score[b]-score[a]||s.positions.indexOf(a)-s.positions.indexOf(b));let seen=previousPairs(s),out=[];while(ids.length>1){let a=ids.shift(),idx=ids.findIndex(b=>!seen.has([a,b].sort().join('|')));if(idx<0)idx=0;out.push([a,ids.splice(idx,1)[0]])}s.bye=ids[0]||null;return out}
function generateRound(c,s){let pairsOut=[];if(s.mode==='swiss')pairsOut=swissPairs(c,s);else if(s.mode==='ladder'){let groups=groupPositions(c,s);if(s.round>1){let results=groups.map(g=>g.map(id=>({id,w:0,d:0})));s.matches.filter(m=>m.round===s.round-1&&m.done).forEach(m=>{let g=results.find(g=>g.some(x=>x.id===m.a));if(!g)return;let a=g.find(x=>x.id===m.a),b=g.find(x=>x.id===m.b);a.w+=+(m.sa>m.sb);b.w+=+(m.sb>m.sa);a.d+=m.sa-m.sb;b.d+=m.sb-m.sa});results.forEach(g=>g.sort((a,b)=>b.w-a.w||b.d-a.d));let newGroups=results.map(g=>g.map(x=>x.id));for(let i=0;i<newGroups.length-1;i++){let n=Math.min(s.move,newGroups[i].length-1,newGroups[i+1].length-1);for(let j=0;j<n;j++){let a=newGroups[i].length-1-j,b=j;[newGroups[i][a],newGroups[i+1][b]]=[newGroups[i+1][b],newGroups[i][a]]}}s.positions=newGroups.flat();groups=groupPositions(c,s)}groups.forEach((g,i)=>{let used=new Set();let seen=previousPairs(s);let options=pairs(g).sort((a,b)=>Number(seen.has(a.slice().sort().join('|')))-Number(seen.has(b.slice().sort().join('|'))));for(let [a,b] of options){if(!used.has(a)&&!used.has(b)){pairsOut.push([a,b,i+1]);used.add(a);used.add(b)}}})}s.matches.push(...pairsOut.map(([a,b,court],i)=>makeMatch(a,b,s.round,court||i%c.courts+1)))}
function playingUI(c,s){let total=s.matches.length,done=s.matches.filter(m=>m.done).length;return `<section class="panel"><div class="row between"><div><h2>Séance ${s.seq} · ${modes[s.mode]}</h2><div class="muted small">${esc(s.date)} · Elo figé jusqu'à la clôture · ${s.mode==='reclass'?esc(s.phase||'brassage')+' · ':''}${done}/${total} matchs terminés</div></div><span class="badge">En cours</span></div><div class="bar" style="margin:15px 0"><i style="width:${total?done/total*100:0}%"></i></div><div class="actions"><button class="btn" onclick="tab='ranking';render()">Voir Elo actuel</button>${s.mode==='challenge'?`<button class="btn primary" onclick="addChallenge()">+ Nouveau défi</button>`:''}${['ladder','swiss'].includes(s.mode)?`<button class="btn" onclick="nextRound()" ${total===0||done!==total||s.round>=s.rounds?'disabled':''}>Rotation / ronde suivante (${s.round}/${s.rounds})</button>`:''}${s.mode==='reclass'&&s.phase==='brassage'?`<button class="btn" onclick="generateReclass()" ${done!==total||!total?'disabled':''}>Générer le reclassement</button>`:''}</div></section><section class="panel"><h2>Rencontres</h2>${s.matches.length?s.matches.map((m,i)=>`<div class="match"><div class="name ${m.done&&m.sa>m.sb?'win':''}">${esc(getName(c,m.a))}</div><input type="number" min="0" value="${m.sa??''}" id="a_${m.id}" placeholder="0"><span>–</span><input type="number" min="0" value="${m.sb??''}" id="b_${m.id}" placeholder="0"><div class="name ${m.done&&m.sb>m.sa?'win':''}">${esc(getName(c,m.b))}</div><button class="btn ${m.done?'':'primary'}" onclick="recordMatch('${m.id}')">${m.done?'Corriger':'Valider'}</button><div class="muted small" style="grid-column:1/-1">Terrain ${m.court} · Ronde ${m.round} ${m.done?'· ✓ enregistré':''}</div></div>`).join(''):'<div class="empty">Ajoutez un défi pour commencer.</div>'}<div class="notice">Les matchs non validés ne comptent pas pour Elo. Chaque score validé compte une fois, indépendamment de l’ordre de saisie.</div></section><section class="panel"><h2>Clôturer la séance</h2><p class="muted">Le calcul Elo utilisera, pour chaque match, les indices de début de séance. La clôture enregistre les nouveaux Elo et le classement.</p><button class="btn primary" onclick="closeSession()" ${!done||done!==total?'disabled':''}>✓ Valider tous les résultats et recalculer Elo</button></section>`}
function recordMatch(id){let s=active(cl()),m=s.matches.find(x=>x.id===id),a=$('a_'+id).value,b=$('b_'+id).value;if(a===''||b===''||+a<0||+b<0||!Number.isInteger(+a)||!Number.isInteger(+b)||+a===+b)return notify('Saisissez deux scores entiers positifs différents (pas de match nul).');m.sa=+a;m.sb=+b;m.done=true;save();render()}function nextRound(){let c=cl(),s=active(c);if(s.matches.some(m=>!m.done))return notify('Terminez les matchs');s.round++;generateRound(c,s);save();render()}function addChallenge(){let c=cl(),s=active(c),ids=presentIds(c,s),names=ids.map((id,i)=>`${i+1}. ${getName(c,id)}`).join('\n');let a=prompt('Défiant : numéro de classement\n'+names);if(a===null)return;let b=prompt('Défié : numéro de classement\n'+names);if(b===null)return;let i=+a-1,j=+b-1;if(!ids[i]||!ids[j]||i===j||Math.abs(i-j)>s.gap)return notify('Défi impossible : vérifiez les rangs et l’écart maximal ('+s.gap+').');s.matches.push(makeMatch(ids[i],ids[j],1,Math.floor(s.matches.length%c.courts)+1));save();render()}function generateReclass(){let c=cl(),s=active(c);let ids=presentIds(c,s),score={};ids.forEach(id=>score[id]={w:0,d:0});s.matches.forEach(m=>{if(m.done){score[m.a].w+=+(m.sa>m.sb);score[m.b].w+=+(m.sb>m.sa);score[m.a].d+=m.sa-m.sb;score[m.b].d+=m.sb-m.sa}});ids.sort((a,b)=>score[b].w-score[a].w||score[b].d-score[a].d||s.positions.indexOf(a)-s.positions.indexOf(b));s.phase='reclassement';s.round=2;s.positions=ids;let groups=[];for(let i=0;i<ids.length;i+=s.groupSize)groups.push(ids.slice(i,i+s.groupSize));s.matches.push(...groups.flatMap((g,i)=>pairs(g).filter(([a,b])=>!s.matches.some(m=>[m.a,m.b].sort().join('|')===[a,b].sort().join('|'))).map(([a,b])=>makeMatch(a,b,2,i+1))));save();render()}function closeSession(){let c=cl(),s=active(c);if(s.matches.some(m=>!m.done)||!s.matches.length)return notify('Tous les matchs doivent être validés.');if(!ask('Clôturer la séance ? Les Elo seront calculés et le classement mis à jour.'))return;s.status='closed';save();tab='ranking';render()}
function ranking(c){let r=ranks(c),p=r.find(x=>x.id===selectedStudent)||r[0];return `<section class="panel"><h2>Classement général Elo</h2><p class="muted small">Classement calculé uniquement à partir des séances clôturées. Chaque match validé contribue individuellement au calcul.</p>${rankingTable(r)}</section>${p?`<section class="panel"><h2>Fiche individuelle · ${esc(p.name)}</h2><div class="grid"><div class="stat"><b>${fmt(p.elo)}</b><small>Elo actuel</small></div><div class="stat"><b>${p.wins} / ${p.played}</b><small>Matchs gagnés</small></div><div class="stat"><b>${p.for} / ${p.against}</b><small>Points marqués / encaissés</small></div><div class="stat"><b>${p.opponents.size}</b><small>Adversaires différents</small></div></div><h3 style="margin-top:20px">Évolution par séance</h3><div class="tablewrap"><table><tr><th>Séance</th><th>Variation</th><th>Elo final</th></tr>${p.history.map(h=>`<tr><td>${h.seq}</td><td class="${h.delta>=0?'good':'bad'}">${h.delta>=0?'+':''}${fmt(h.delta)}</td><td>${fmt(h.elo)}</td></tr>`).join('')}</table></div><h3 style="margin-top:20px">Adversaires rencontrés</h3><div class="tablewrap"><table><tr><th>Adversaire</th><th>Matchs</th><th>Victoires</th><th>Points pour / contre</th></tr>${Array.from(p.opponents).map(id=>{let ms=c.sessions.filter(s=>s.status==='closed').flatMap(s=>s.matches).filter(m=>m.done&&[m.a,m.b].includes(p.id)&&[m.a,m.b].includes(id));return `<tr><td>${esc(getName(c,id))}</td><td>${ms.length}</td><td>${ms.filter(m=>m.a===p.id?m.sa>m.sb:m.sb>m.sa).length}</td><td>${ms.reduce((v,m)=>v+(m.a===p.id?m.sa:m.sb),0)} / ${ms.reduce((v,m)=>v+(m.a===p.id?m.sb:m.sa),0)}</td></tr>`}).join('')}</table></div></section>`:''}`}
function history(c){return `<section class="panel"><h2>Historique des séances</h2>${c.sessions.map(s=>`<div class="row between" style="padding:13px;border-bottom:1px solid #29445a"><div><b>Séance ${s.seq}</b> · ${esc(s.date)} · ${modes[s.mode]}<div class="muted small">${s.matches.filter(m=>m.done).length} matchs · ${s.absent.length} absents · ${s.status==='closed'?'Clôturée':'En cours'}</div></div><div class="actions">${s.status==='closed'?`<button class="btn" onclick="reopenSession('${s.id}')">Rouvrir</button>`:`<button class="btn" onclick="tab='session';render()">Reprendre</button>`}</div></div>`).join('')||'<div class="empty">Aucune séance</div>'}</section>`}function reopenSession(id){let c=cl(),idx=c.sessions.findIndex(s=>s.id===id);if(c.sessions.some(s=>s.status!=='closed'))return notify('Terminez ou annulez la séance active avant de rouvrir une ancienne séance.');if(!ask('Rouvrir cette séance ? Les Elo des séances suivantes seront recalculés après sa nouvelle clôture.'))return;c.sessions[idx].status='playing';save();tab='session';render()}
function settings(c){return `<section class="panel"><h2>Réglages de ${esc(c.name)}</h2><div class="row"><div class="field"><label>Sport</label><select id="sport">${['Badminton','Tennis de table','Pickleball','Tennis','Padel','Autre'].map(v=>`<option ${c.sport===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Nombre de terrains</label><input type="number" id="courts" min="1" max="30" value="${c.courts}"></div><div class="field"><label>Coefficient Elo K (par match)</label><input type="number" id="k" min="1" max="100" value="${c.k}"></div></div><button class="btn primary" onclick="saveSettings()">Enregistrer les réglages</button><p class="muted small">K est mémorisé à la création de chaque séance. Modifier K ici n'affecte pas les séances précédentes.</p></section><section class="panel"><h2>Sauvegarde et transfert</h2><div class="actions"><button class="btn" onclick="exportJSON()">Exporter sauvegarde JSON</button><button class="btn" onclick="exportCSV()">Exporter classement CSV</button><label class="btn">Importer sauvegarde JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importJSON(this)"></label></div><p class="muted small">Le stockage local n'est pas synchronisé entre appareils. Une sauvegarde régulière est indispensable.</p></section><section class="panel"><h2>Gestion</h2><button class="btn danger" onclick="deleteClass()">Supprimer cette classe et ses données</button></section>`}function saveSettings(){let c=cl(),n=+$('courts').value,k=+$('k').value;if(!Number.isInteger(n)||n<1||n>30||!Number.isFinite(k)||k<1||k>100)return notify('Réglages invalides');c.courts=n;c.k=k;c.sport=$('sport').value;save();render()}function exportJSON(){download('racket-eps-sauvegarde.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let c=cl(),rows=[['Rang','Eleve','Elo','Matchs','Victoires','Defaites','Points marques','Points encaisses','Adversaires distincts'],...ranks(c).map((p,i)=>[i+1,p.name,fmt(p.elo),p.played,p.wins,p.losses,p.for,p.against,p.opponents.size])];download('classement-'+c.name.replace(/[^a-z0-9]/gi,'-')+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importJSON(el){let file=el.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.classes)||!x.classes.every(c=>Array.isArray(c.students)&&Array.isArray(c.sessions)))throw Error('Structure invalide');if(!ask('Remplacer toutes les données locales par cette sauvegarde ?'))return;db=x;save();render()}catch(e){notify('Import impossible : '+e.message)}}function deleteClass(){let c=cl();if(!ask('Supprimer définitivement '+c.name+' et toutes ses séances ?'))return;db.classes=db.classes.filter(x=>x.id!==c.id);db.active=db.classes[0]?.id||null;save();render()}
render();if(cl()&&tab==='session'&&!active(cl()))setTimeout(modeFields,0);const observer=new MutationObserver(()=>{if($('smode')&&!$('modeOptions').children.length)modeFields()});observer.observe($('view'),{childList:true,subtree:false});
</script></body></html>
